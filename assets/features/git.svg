</style>
<defs><linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="96" y2="96"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#14b8a6"/></linearGradient><linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="sh" filterUnits="userSpaceOnUse" x="0" y="0" width="96" height="96"><feDropShadow dx="0" dy="1.4" stdDeviation="1.3" flood-color="#1e1b4b" flood-opacity=".3"/></filter></defs>
<rect width="96" height="96" rx="22" fill="url(#bg)"/>
