[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/post-tester/post-tester"
rust-version = "1.97"

[workspace.dependencies]
# Internal crates
post-tester-core = { path = "crates/core" }
post-tester-plugin-host = { path = "crates/plugin-host" }
post-tester-mcp = { path = "crates/mcp" }
post-tester-server = { path = "crates/server" }

# Async runtime and utilities
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"

# HTTP stack
http = "1.5"
hyper = { version = "1.12", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12"
url = { version = "2.5", features = ["serde"] }
percent-encoding = "2.3"
cookie_store = "0.22"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1.0"
# TLS for wss:// uses our own rustls config (ring + webpki roots), passed per connection.
tokio-tungstenite = { version = "0.29", features = ["__rustls-tls"] }
flate2 = "1.1"
brotli = "9.0"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
serde_json_path = "0.7"
schemars = "1.2"
ts-rs = { version = "12.0", features = ["serde-json-impl", "uuid-impl", "chrono-impl"] }

# Misc
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.28", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
shell-words = "1.1"

# Front-ends
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
rust-embed = "8.13"
mime_guess = "2.0"
clap = { version = "4.6", features = ["derive", "env"] }
owo-colors = "4.4"
open = "5.4"
rquickjs = { version = "0.14", features = ["futures", "macro", "loader", "parallel"] }
rmcp = { version = "3.5", default-features = false }
keyring = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
redundant_clone = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
