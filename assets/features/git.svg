@keyframes k2{0%{transform:scale(0);opacity:1}6%{transform:scale(0);opacity:1;animation-timing-function:cubic-bezier(.3,.7,.4,1)}10.8%{transform:scale(1.18);opacity:1;animation-timing-function:ease-in-out}14%{transform:scale(1);opacity:1}78%{transform:scale(1);opacity:1}87%{transform:scale(.6);opacity:0}100%{transform:scale(0);opacity:0}}
@keyframes k3{0%{transform:scale(0);opacity:1}30%{transform:scale(0);opacity:1;animation-timing-function:cubic-bezier(.3,.7,.4,1)}34.8%{transform:scale(1.18);opacity:1;animation-timing-function:ease-in-out}38%{transform:scale(1);opacity:1}78%{transform:scale(1);opacity:1}87%{transform:scale(.6);opacity:0}100%{transform:scale(0);opacity:0}}
