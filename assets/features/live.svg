<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
<title id="title">Live by default</title>
<desc id="desc">A pulse trace inside viewfinder corners, swept live like a monitor by a glowing head.</desc>
<style>
@keyframes k0{0%{stroke-dashoffset:136.8;stroke-opacity:0.58}100%{stroke-dashoffset:-15.2;stroke-opacity:0.58}}
