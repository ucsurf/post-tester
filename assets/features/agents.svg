<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
<title id="title">Agents welcome</title>
<desc id="desc">A bot with blinking eyes, sending signal arcs from its antenna.</desc>
<style>
@keyframes k0{0%{stroke-opacity:.3}12%{stroke-opacity:1}44%{stroke-opacity:.3}100%{stroke-opacity:.3}}
@keyframes k1{0%{stroke-opacity:.3}10%{stroke-opacity:.3}24%{stroke-opacity:1}56%{stroke-opacity:.3}100%{stroke-opacity:.3}}
@keyframes k2{0%{opacity:.9}30%{opacity:.25}100%{opacity:.9}}
@keyframes k3{0%{transform:scaleY(1)}60%{transform:scaleY(1)}62%{transform:scaleY(.12)}64.5%{transform:scaleY(1)}69%{transform:scaleY(1)}71%{transform:scaleY(.12)}73.5%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.ey{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.da{stroke-dasharray:none!important}}
</style>
<defs><linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="96" y2="96"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#14b8a6"/></linearGradient><linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="sh" filterUnits="userSpaceOnUse" x="0" y="0" width="96" height="96"><feDropShadow dx="0" dy="1.4" stdDeviation="1.3" flood-color="#1e1b4b" flood-opacity=".3"/></filter><radialGradient id="hg"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
<rect width="96" height="96" rx="22" fill="url(#bg)"/>
<circle cx="48" cy="32" r="12" fill="url(#hg)" style="animation:k2 3s ease-in-out infinite"/>
<g filter="url(#sh)" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"><rect x="25" y="45" width="46" height="36" rx="10"/><path d="M48 45V36M16 57V69M80 57V69"/><circle cx="48" cy="32" r="4.6" fill="#fff" stroke="none"/><g class="ey" style="animation:k3 6s ease-in-out infinite" fill="#fff" stroke="none"><rect x="36.5" y="57" width="7" height="11" rx="3.5"/><rect x="52.5" y="57" width="7" height="11" rx="3.5"/></g><path d="M40.93 24.93A10 10 0 0 1 55.07 24.93" stroke-width="4.5" style="animation:k0 3s ease-in-out infinite"/><path d="M35.63 19.63A17.5 17.5 0 0 1 60.37 19.63" stroke-width="4.5" style="animation:k1 3s ease-in-out infinite"/></g>
<rect width="96" height="96" rx="22" fill="url(#hl)"/>
<rect x=".75" y=".75" width="94.5" height="94.5" rx="21.25" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/>
</svg>
